<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>NHL Leaderboard</title>
    </head>


    
    <body>
        <h1>Test</h1>
        <button id="api-test-button">API Test</button>
        <pre id="output"></pre>

        <script>
            async function loadNhlData() {
                try {
                    const response = await fetch("/api/nhl-rankings");
                    const data = await response.json();
                    console.log("NHL rankings:", data);
                    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
                } catch (error) {
                    console.error("Error fetching NHL rankings:", error);
                }
            }

            document.getElementById("api-test-button").addEventListener("click", loadNhlData);
        </script>
    </body>
</html>
